name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize]

# Cancel an in-flight review when a new commit is pushed to the same PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ai-review:
    runs-on: ubuntu-latest
    # 50 turns * ~15s/turn through the model API plus setup headroom.
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 100

      - name: Fetch main branch
        run: git fetch origin main --depth=100

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Run AI Review
        env:
          ANTHROPIC_BASE_URL: https://api.z.ai/api/anthropic
          ANTHROPIC_API_KEY: ${{ secrets.AI_CODE_REVIEW_ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: glm-5.3
          # Keep background calls (session titles, etc.) off the main model.
          ANTHROPIC_SMALL_FAST_MODEL: glm-5.1
        run: |
          # claude exits 1 on error_max_turns / API errors; keep going so the
          # diagnostic message below still reaches the PR.
          claude -p "$(cat .claude/commands/code-review.md)" \
            --output-format json \
            --max-turns 50 \
            --model "$CLAUDE_MODEL" \
            --allowedTools "Read,Grep,Glob,Bash(git diff *),Bash(git log *),Bash(git show *),Bash(git merge-base *),Agent" \
            > review.json || true
          jq -r 'if (.result // "") != "" then .result
            else "⚠️ AI review did not complete (" + (.subtype // "no subtype") + ", "
            + ((.num_turns // 0) | tostring) + " turns)\n\n"
            + ((.errors // ["no error details"]) | join("\n")) end' review.json > ai-review-output.txt \
            || echo "⚠️ AI review crashed without producing JSON" > ai-review-output.txt

      - name: Post review comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} \
            --body-file ai-review-output.txt
