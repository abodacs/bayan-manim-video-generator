[project]
name = "bayan"
version = "0.1.0"
description = "Bayan: Arabic AI-Powered Manim Video Generator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "manim>=0.21.0",
    "typer>=0.27.2",
    "arabic-reshaper>=3.0.1",
    "python-bidi>=0.6.11",
    "openai>=3.8.0",
    "python-dotenv>=1.2.2",
    "pydantic>=2.6",
    "pillow>=12.3.0",
]

[project.scripts]
bayan = "bayan.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.6",
    "setuptools<85",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
]

# -----------------------------------------------------------------------------
# Ruff — lint + format
# -----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
# Recorded golden scene fixtures are captured artifacts of the coder's
# contract output (star imports, generated look), not maintained code.
extend-exclude = ["tests/golden/prompts"]
# Pre-commit passes filenames explicitly; without this, excluded files
# (the recorded golden fixtures) would still be linted.
force-exclude = true

[tool.ruff.lint]
# E/F = pyflakes + pycodestyle, I = import sorting, UP = pyupgrade,
# B = bugbear, SIM = simplifications, C4 = comprehensions.
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.ruff.lint.per-file-ignores]
# Manim scenes idiomatically use `from manim import *` -- F401/F403/F405 are
# the star-import noise that produces.
"bayan/utils/sanity_check.py" = ["F401", "F403", "F405"]

# Standalone runnable templates under templates/ share the same star-import
# pattern, and a few manipulate sys.path (so they can import the bayan package)
# before importing from it -- E402 is the resulting "import not at top" noise.
"templates/*.py" = ["F401", "F403", "F405", "E402"]
# The course ships runnable Manim scenes (star-imports, the idiomatic pattern)
# plus a zero-dep stdlib generator; mirror the templates ignores so the gate
# passes without fighting the library's import style.
"course/**/*.py" = ["F401", "F403", "F405", "E402"]
# generator.py is a standalone static-site build script (not a library import),
# with %-formatted HTML templates and loop variables named to match the data
# they walk -- these ignores are scoped to it alone, not the whole course tree.
"course/generator.py" = ["E501", "E741", "SIM115", "UP031"]

[tool.ruff.format]
# Defaults: double quotes, trailing commas.

# -----------------------------------------------------------------------------
# mypy — static type checking
# -----------------------------------------------------------------------------
# Strict on the package. The Manim scene (bayan/utils/sanity_check.py) uses
# `from manim import *`, which is fundamentally untyped/dynamic, so it is
# excluded rather than fought. See docs/agdr/AgDR-0001-type-checker.md.
# The course tree is excluded the same way: its lessons are runnable Manim
# scenes (star-imports by design), and course/generator.py is a standalone
# stdlib site-builder gated by ruff + its own CI validation job.
[tool.mypy]
python_version = "3.11"
strict = true
exclude = [
    "sanity_check\\.py$",
    "^tests/",
    "^course/",
]

# -----------------------------------------------------------------------------
# pytest + coverage
# -----------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
# Keep the threshold at zero while the first vertical slice is incomplete.
# The Arabic helper already has focused coverage; raise this gate as the
# generation, rendering, and validation boundaries gain testable contracts.
addopts = "--cov=bayan --cov-report=term-missing --cov-fail-under=0"

[tool.coverage.run]
source = ["bayan"]
branch = true
# The sanity-check scene is a Manim render entrypoint -- exercised by rendering,
# not by unit tests, so don't let it drag the coverage number.
omit = ["bayan/utils/sanity_check.py"]

[tool.coverage.report]
show_missing = true
